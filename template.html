<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-avatar" aria-hidden="true">💬</div>
            <div class="header-info">
                <h1 dir="auto">{chat_name}</h1>
                <div class="subtitle">{message_count} messages</div>
            </div>
        </div>
        <div class="messages-container">
            {messages}
        </div>
    </div>

    <!-- Lightbox Modal for Fullscreen Media Viewing -->
    <div id="mediaModal" class="modal" onclick="closeModal()" role="dialog" aria-modal="true">
        <span class="modal-close" aria-label="Close Preview">&times;</span>
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
